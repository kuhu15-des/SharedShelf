<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Shared Shelf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a dark cosmos stage (canvas: streaks of violet, blue and dark red; one galaxy per friend that you fly into) with a glass HUD on top, a book drawer on the side, and console buttons plus working panels below the stage. */
:root {
  --bg: #05030f;
  --surface: #0d0a22;
  --fg: #ece9ff;
  --muted: #9a93c4;
  --line: #241e4a;
  --accent: #a28bff;
  --accent-fg: #0b0620;
  --mine: #2a2064;
  --ok: #6fd1a0; --ok-bg: #12301f;
  --out: #f0b955; --out-bg: #34270c;
  --late: #ff9b9b; --late-bg: #3a1c1d;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eeeaf8;
  --surface: #fbfaff;
  --fg: #1a1438;
  --muted: #5d5588;
  --line: #d8d1ee;
  --accent: #5a3fd0;
  --accent-fg: #ffffff;
  --mine: #e0d8fb;
  --ok: #1f7a4d; --ok-bg: #d9f0e2;
  --out: #8a5200; --out-bg: #fbe9c8;
  --late: #a3262a; --late-bg: #f9dcdc;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-block: 16px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* the stage is always night, whatever the page theme */
.stage {
  --fg: #eceaff; --muted: #a49ccf; --line: #2c2560; --surface: rgba(255, 255, 255, 0.05); --bg: #07041a;
  --accent: #a791ff; --accent-fg: #0b0620; --mine: #2a2064;
  --ok: #6fd1a0; --ok-bg: #12301f; --out: #f0b955; --out-bg: #34270c; --late: #ff9b9b; --late-bg: #3a1c1d;
  position: relative; height: clamp(460px, 68vh, 640px); border-radius: 26px; overflow: hidden; isolation: isolate;
  border: 1px solid var(--line); background: #03020b; color: var(--fg);
}
#cosmos { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.hud { position: absolute; z-index: 2; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.tl { left: 20px; top: 18px; right: 76px; max-width: 460px; display: flex; flex-direction: column; gap: 6px; text-shadow: 0 1px 14px rgba(3, 2, 11, 0.9); }
.hud.tr { right: 16px; top: 16px; display: flex; gap: 8px; align-items: center; }
.hud.bl { left: 16px; right: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.stage.drawer-open .hud.bl { right: 372px; }
.eyebrow { margin: 0; font-size: 0.6875rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 300; font-size: clamp(2.2rem, 6.5vw, 3.7rem); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 44ch; font-size: 0.9375rem; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 20px; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-family: var(--font-display); font-size: 1.25rem; font-weight: 500; letter-spacing: 0; margin-right: 5px; }
.who { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--muted); font-size: 0.875rem; }
.who b { color: var(--fg); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 0.875rem; }
.sbtn { height: 40px; min-width: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(167, 145, 255, 0.35); background: rgba(14, 9, 40, 0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; color: #eceaff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.875rem; }
.sbtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gals { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.gals::-webkit-scrollbar { display: none; }
.gchip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; border: 1px solid rgba(167, 145, 255, 0.28); background: rgba(14, 9, 40, 0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; font-size: 0.8125rem; color: #eceaff; }
.gchip i { width: 14px; height: 14px; border-radius: 50%; }
.gchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 18px -4px var(--accent); }
.gchip span { color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 0.75rem; color: var(--muted); text-shadow: 0 1px 10px #03020b; }
.tip { position: absolute; z-index: 3; left: 0; top: 0; pointer-events: none; max-width: 260px; padding: 8px 12px; border-radius: 12px; background: rgba(10, 6, 32, 0.9); border: 1px solid rgba(167, 145, 255, 0.4); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
.tip b { display: block; font-family: var(--font-display); font-size: 1.1875rem; font-weight: 500; line-height: 1.15; }
.tip span { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.drawer { position: absolute; z-index: 4; top: 12px; right: 12px; bottom: 12px; width: 348px; overflow-y: auto; border-radius: 20px; padding: 16px; background: rgba(9, 6, 28, 0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(167, 145, 255, 0.35); display: flex; flex-direction: column; gap: 12px; }
.drawer .dhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.drawer .card { padding: 0; }
.drawer dl { grid-template-columns: 1fr 1fr; }

/* console buttons */
.rail { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.dial { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 10px 20px 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; color: var(--fg); text-align: left; }
.dial::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0; transition: opacity 0.2s; }
.dial[aria-selected="true"] { border-color: var(--accent); }
.dial[aria-selected="true"]::after { opacity: 1; }
.dial svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.dn { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; line-height: 1.1; }
.ds { display: block; font-size: 0.625rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.badge { display: inline-block; min-width: 1.25rem; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 0.75rem; text-align: center; font-variant-numeric: tabular-nums; margin-left: 6px; }

/* panels */
.controls { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; padding: 10px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
select { padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; max-width: 100%; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 0.875rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.label { font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); min-width: 4.5rem; }
.count { color: var(--muted); font-size: 0.875rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.list, .loans { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.book { border-bottom: 1px solid var(--line); }
.book:last-child, .loan:last-child { border-bottom: 0; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 20px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
.head:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.title { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; line-height: 1.2; overflow-wrap: anywhere; }
.by { color: var(--muted); font-size: 0.875rem; }
.by .no { font-style: italic; }
.mark { display: inline-block; font-size: 0.75rem; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-right: 8px; }
.pill { font-size: 0.8125rem; font-weight: 500; padding: 3px 12px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.out { background: var(--out-bg); color: var(--out); }
.pill.late { background: var(--late-bg); color: var(--late); }
.gaps { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.gap-tag { font-size: 0.75rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.card { padding: 4px 20px 20px; display: grid; gap: 16px; }
dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 24px; }
dt { font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
dd.gap { color: var(--muted); font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.8125rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
.slip { border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); padding: 18px; display: grid; gap: 12px; }
.slip h3 { margin: 0; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fields { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
.field label { font-size: 0.8125rem; color: var(--muted); }
.field input, .field select { padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 100%; min-width: 0; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 600; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.small { padding: 6px 14px; font-size: 0.875rem; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.note { color: var(--muted); font-size: 0.875rem; margin: 0; }
.err { color: var(--late); font-size: 0.875rem; margin: 0; }
.okmsg { color: var(--ok); font-size: 0.875rem; margin: 0; }
.loan { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.empty { padding: 36px 20px; color: var(--muted); }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 500; }

/* gate (join) */
.door .slip { padding: 22px; }
.door h2 { font-family: var(--font-display); font-weight: 300; font-size: 2rem; line-height: 1.1; margin: 0; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: center; }
.pickinfo { display: grid; gap: 12px; min-width: 0; }
.eyebrow2 { margin: 0; font-size: 0.6875rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.sname2 { font-family: var(--font-display); font-weight: 300; font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1; margin: 0; }
.gprev { width: 100%; max-width: 260px; aspect-ratio: 4 / 3; height: auto; display: block; margin: 0 auto; border-radius: 16px; background: #03020b; border: 1px solid var(--line); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 50% 50%, var(--s0), var(--s1) 55%, var(--s2)); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.whoopts { display: flex; flex-wrap: wrap; gap: 8px; }

/* letters */
.inbox { display: grid; grid-template-columns: 230px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 20px; background: var(--surface); min-height: 420px; overflow: hidden; }
.plist { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; cursor: pointer; align-items: center; }
.person[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.person b { font-weight: 600; overflow-wrap: anywhere; }
.person .prev { grid-column: 1 / -1; color: var(--muted); font-size: 0.8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { display: flex; flex-direction: column; min-width: 0; }
.thead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.back { display: none; }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 14px; overflow-y: auto; max-height: 460px; min-height: 260px; }
.bubble { max-width: 82%; padding: 8px 14px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border: 1px solid var(--line); overflow-wrap: anywhere; }
.bubble.mine { align-self: flex-end; background: var(--mine); border-color: transparent; }
.bubble time { display: block; font-size: 0.6875rem; color: var(--muted); margin-top: 2px; }
.reqcard { align-self: stretch; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.reqcard h4 { margin: 0; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.reqcard .title { font-size: 1.125rem; }
.compose { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.compose input { flex: 1; min-width: 0; padding: 10px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; }
.hint2 { padding: 32px 16px; color: var(--muted); }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.egrid .wide { grid-column: 1 / -1; }
footer { color: var(--muted); font-size: 0.8125rem; text-align: center; padding-top: 8px; }

@media (max-width: 700px) {
  .stage { height: clamp(520px, 84vh, 640px); }
  .hud.tl { left: 14px; top: 64px; right: 14px; }
  .hud.bl { left: 10px; right: 10px; bottom: 10px; }
  .stage.drawer-open .hud.bl { display: none; }
  .hint { display: none; }
  .drawer { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 56%; }
  .rail { display: grid; grid-template-columns: 1fr 1fr; }
  .head, .loan { grid-template-columns: minmax(0, 1fr); }
  .head .pill, .loan .pill { justify-self: start; }
  .gaps { justify-content: flex-start; }
  .pick { grid-template-columns: minmax(0, 1fr); }
  .gprev { order: -1; max-width: 220px; }
  .inbox { grid-template-columns: minmax(0, 1fr); }
  .plist { border-right: 0; }
  .inbox.thread-open .plist { display: none; }
  .inbox:not(.thread-open) .thread { display: none; }
  .back { display: inline-block; }
  .bubble { max-width: 92%; }
}

/* header above the sky, so text never sits on the galaxies */
.top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.topl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.top .sbtn { background: var(--surface); border-color: var(--line); color: var(--fg); flex: 0 0 auto; }
.top .eyebrow, .top .lede { text-shadow: none; }
.stage .hud.bl { z-index: 2; }

.topr { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
.nightlist {
  --fg: #eceaff; --muted: #a49ccf; --line: #2c2560; --surface: rgba(255, 255, 255, 0.05); --bg: #07041a;
  --accent: #a791ff; --accent-fg: #0b0620; --mine: #2a2064;
  --ok: #6fd1a0; --ok-bg: #12301f; --out: #f0b955; --out-bg: #34270c; --late: #ff9b9b; --late-bg: #3a1c1d;
  color: var(--fg);
}
.listwrap { position: relative; isolation: isolate; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); background: #03020b; }
.listwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; pointer-events: none; }
.listwrap .list { background: rgba(8, 5, 26, 0.45); border: 0; border-radius: 0; backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
.pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 14px 12px; border-top: 1px solid var(--line); background: rgba(8, 5, 26, 0.55); }
.pager .pn { min-width: 38px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.pager .pn[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.pager .pn[disabled] { opacity: 0.4; cursor: default; }
.pager .pinfo { width: 100%; text-align: center; color: var(--muted); font-size: 0.8125rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topl">
      <p class="eyebrow">A library of friends</p>
      <h1>The Shared Shelf</h1>
      <p class="lede" id="h-lede"></p>
      <div class="stats" id="stats" aria-live="polite"></div>
      <div class="who" id="who"></div>
    </div>
    <div class="topr">
      <button class="sbtn" id="signout" type="button" hidden>Sign out</button>
      <button class="sbtn" id="music" type="button" aria-label="Turn ambient music on" aria-pressed="false"></button>
      <button class="sbtn" id="sound" type="button" aria-label="Turn sound off" aria-pressed="true"></button>
      <button class="sbtn" id="theme" type="button" aria-label="Switch to light mode"></button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="The universe of shelves">
    <canvas id="cosmos" role="img" aria-label="A field of galaxies, one for each friend. Each glowing dot is one of their books. Use the buttons below or the Star chart to browse without the picture."></canvas>
    <div class="hud tr"><button class="sbtn" id="backbtn" type="button" hidden>All galaxies</button></div>
    <div class="hud bl">
      <div class="gals" id="gals" role="group" aria-label="Galaxies"></div>
      <p class="hint" id="h-hint"></p>
    </div>
    <div class="tip" id="tip" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-label="Book details"></aside>
  </section>

  <nav class="rail" role="tablist" aria-label="Sections" id="rail"></nav>

  <section class="door" id="door" hidden></section>

  <section id="view-cat" class="controls">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search title, author, tag or ISBN" aria-label="Search books">
      <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
      <select id="lang" aria-label="Language"><option value="">All languages</option></select>
    </div>
    <div class="row"><span class="label">Status</span>
      <button class="chip" data-st="all" aria-pressed="true">All</button>
      <button class="chip" data-st="avail" aria-pressed="false">Available</button>
      <button class="chip" data-st="out" aria-pressed="false">Adrift</button>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="listwrap nightlist" id="listwrap"><canvas id="listbg"></canvas><canvas id="listtw"></canvas><div class="list" id="list"></div><div class="pager" id="pager" hidden></div></div>
  </section>

  <section id="view-loans" hidden><div class="loans" id="loans"></div></section>
  <section id="view-inbox" hidden><div id="inbox"></div></section>

  <section id="view-data" class="controls" hidden>

  function renderView() { if (state.view === "cat") renderList(); else if (state.view === "loans") renderLoans(); else if (state.view === "inbox") renderInbox(); else renderData(); }
  function renderAll() {
    recompute(); findMe(); syncGalaxies();
    if (state.focus && !S.gals[state.focus]) { state.focus = ""; state.owner = ""; }
    if (state.sel && !byId[state.sel]) state.sel = "";
    renderWho(); renderHud(); renderGals(); renderStats(); fillFilters(); renderFoot(); renderView(); renderDrawer(); renderDoor();
    fillSelect($("downer"), "Every owner", CODES, state.downer);
    Array.prototype.forEach.call($("downer").options, function (o) { if (o.value) o.textContent = fullName(o.value); });
    $("downer").value = state.downer; computeHl(); requestDraw();
  }
  function setView(v) {
    state.view = v;
    Array.prototype.forEach.call(document.querySelectorAll(".dial"), function (t) { t.setAttribute("aria-selected", String(t.getAttribute("data-view") === v)); });
    ["cat", "loans", "inbox", "data"].forEach(function (n) { $("view-" + n).hidden = n !== v; });
    renderView(); renderStats();
  }
  function showDbMsg(t) { var m = $("dbmsg"); m.hidden = !t; m.textContent = t || ""; }

  function startData() {
    if (started) return; started = true; dbState = "loading";
    var onErr = function () { showDbMsg("Some shared data is unavailable right now. You can still browse the universe."); };
    db.collection("loans").onSnapshot(function (snap) {
      showDbMsg("");
      var next = {}; snap.docs.forEach(function (d) { var v = d.data(); if (v && v.bookId) next[v.bookId] = v; });
      loans = next; dbState = "ready"; renderAll();
    }, onErr);
    db.collection("friends").onSnapshot(function (snap) { var docs = {}; snap.docs.forEach(function (d) { docs[d.id] = d.data(); }); rebuildFriends(docs); renderAll(); }, onErr);
    db.collection("messages").onSnapshot(function (snap) {
      messages = snap.docs.map(function (d) { var v = d.data() || {}, o = {}; Object.keys(v).forEach(function (k) { o[k] = v[k]; }); o.id = d.id; return o; }); renderAll();
    }, onErr);
    db.collection("books").onSnapshot(function (snap) {
      var ov = {}, ad = [];
      snap.docs.forEach(function (d) { var v = d.data(); if (!v) return; if (v.added) { var o = {}; Object.keys(v).forEach(function (k) { o[k] = v[k]; }); o.i = d.id; ad.push(o); } else ov[d.id] = v; });
      overrides = ov; added = ad; renderAll();
    }, onErr);
  }
  function checkMember() {
    db.doc("settings/keeper").get().then(function () { owner = true; member = true; }).catch(function () {})
      .then(function () { if (member) return; return db.doc("members/" + uid).get().then(function (s) { member = !!s.exists; }).catch(function () { member = false; }); })
      .then(function () {
        if (member) startData(); else dbState = "off";
        var j = state.join; if (j.step === "signin") j.step = member ? "who" : "code";
        renderAll();
      });
  }
  function connect() {
    if (!window.firebase || !window.FIREBASE_CONFIG) { dbState = "off"; authReady = true; showDbMsg("Sign-in is unavailable right now. You can still browse the universe."); renderAll(); return; }
    try { firebase.initializeApp(window.FIREBASE_CONFIG); auth = firebase.auth(); db = firebase.firestore(); }
    catch (e) { dbState = "off"; authReady = true; showDbMsg("Could not start sign-in. Reload the page."); renderAll(); return; }
    $("signout").onclick = function () { auth.signOut().then(function () { location.reload(); }); };
    auth.getRedirectResult().catch(function () {});
    auth.onAuthStateChanged(function (u) {
      authReady = true; uid = u ? u.uid : null; owner = false; member = false; $("signout").hidden = !u;
      if (!u) { dbState = "off"; renderAll(); return; }
      checkMember();
    });
  }

  function start(data) {
    base = data;
    $("genre").onchange = function () { state.genre = this.value; state.page = 0; renderList(); };
    $("lang").onchange = function () { state.lang = this.value; state.page = 0; renderList(); };
    var timer = null, t2 = null;
    $("q").oninput = function () { var v = this.value; clearTimeout(timer); timer = setTimeout(function () { state.q = v.trim(); state.page = 0; renderList(); }, 120); };
    $("dq").oninput = function () { var v = this.value; clearTimeout(t2); t2 = setTimeout(function () { state.dq = v.trim(); renderData(); }, 120); };
    $("downer").onchange = function () { state.downer = this.value; renderData(); };
    $("dmiss").onchange = function () { state.dmiss = this.value; renderData(); };
    $("addbook").onclick = function () { startNew(); renderData(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-st]"), function (c) {
      c.onclick = function () {
        state.st = c.getAttribute("data-st"); state.page = 0;
        Array.prototype.forEach.call(document.querySelectorAll("[data-st]"), function (x) { x.setAttribute("aria-pressed", String(x === c)); });
        renderList();
      };
    });
    recompute(); initTheme(); initSound(); buildNav(); initCosmos(); renderAll(); initListBg(); connect();
  }

  fetch("books.json").then(function (r) { return r.json(); }).then(start).catch(function () {
    $("list").appendChild(el("div", "empty", "The book list could not be loaded."));
  });
})();
</script>
</body>
</html>
